name: Build Streamstiny TIPA
on:
  push:
    branches: [main]
    paths:
      - 'Streamstiny/**'
      - 'Tests/**'
      - 'scripts/build_input_times.py'
      - 'scripts/compact_packages.py'
      - 'scripts/patch_playback.py'
      - 'scripts/package.sh'
      - 'scripts/validate_ipa.py'
      - 'scripts/Streamstiny.entitlements'
      - 'project.yml'
      - 'dependencies.yml'
      - '.github/workflows/build.yml'
      - '.gitattributes'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Streamstiny/**'
      - 'Tests/**'
      - 'scripts/build_input_times.py'
      - 'scripts/compact_packages.py'
      - 'scripts/patch_playback.py'
      - 'scripts/package.sh'
      - 'scripts/validate_ipa.py'
      - 'scripts/Streamstiny.entitlements'
      - 'project.yml'
      - 'dependencies.yml'
      - '.github/workflows/build.yml'
      - '.gitattributes'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Serialize main builds through publication so two builds cannot select one version.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  tests:
    if: github.repository == 'EscapeAltDelete/Streamstiny'
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check playback and build tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          xcrun swiftc -swift-version 5 -parse-as-library Streamstiny/{ChatModels,ChatProtocol,HLSPlaylist,TwitchAdPlaylist,StreamSource,PlaybackResolver,YouTubeResolver,TwitchResolver}.swift Tests/*.swift -o "$RUNNER_TEMP/playback-tests"
          "$RUNNER_TEMP/playback-tests"
  compile:
    if: >-
      ${{ github.repository == 'EscapeAltDelete/Streamstiny' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
           (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/dependencies/playback-'))) }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      # Bump when changing the runner, SDK, toolchain, or cache layout.
      BUILD_CACHE_VERSION: v2-arm64-macos15-xcode16.4
      GIT_NO_LAZY_FETCH: 1
    steps:
      - name: Select app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=1
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | sed -nE 's/^v0\.0\.([0-9]+)$/\1/p' | sort -n | tail -n 1)
            build=$((${latest:-0} + 1))
          fi
          echo "version=0.0.$build" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=0.0.$build" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore verified XcodeGen archive
        id: xcodegen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/Streamstiny/xcodegen.zip
          key: xcodegen-macos-2.44.1-a2e905fb68446e9b
      - name: Generate Xcode project
        run: |
          ARCHIVE="$HOME/Library/Caches/Streamstiny/xcodegen.zip"
          mkdir -p "$(dirname "$ARCHIVE")"
          if [ ! -f "$ARCHIVE" ]; then
            curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$ARCHIVE"
          fi
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  '"$ARCHIVE" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
      - name: Restore pinned native playback packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/SourcePackages
          key: swiftpackages-ios-arm64-v2-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py') }}-${{ hashFiles('scripts/compact_packages.py') }}
          restore-keys: |
            swiftpackages-ios-arm64-v2-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py') }}-
            swiftpackages-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py') }}
      - name: Restore compiled release products
        id: release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/device/Build
            build/device/ModuleCache.noindex
            build/device/SDKStatCaches.noindex
            build/device/ci-inputs.json
          key: release-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py', 'scripts/build_input_times.py', 'scripts/compact_packages.py') }}-${{ hashFiles('project.yml', 'Streamstiny/**') }}
          restore-keys: release-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py', 'scripts/build_input_times.py', 'scripts/compact_packages.py') }}-
      - name: Build optimized ARM64 Release
        run: |
          RESOLVED="Streamstiny.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f build/SourcePackages/Package.resolved ]; then
            mkdir -p "$(dirname "$RESOLVED")"
            cp build/SourcePackages/Package.resolved "$RESOLVED"
          else
            xcodebuild -resolvePackageDependencies -project Streamstiny.xcodeproj -scheme Streamstiny -clonedSourcePackagesDirPath build/SourcePackages -skipPackageUpdates
            cp "$RESOLVED" build/SourcePackages/Package.resolved
          fi
          python3 scripts/compact_packages.py
          python3 scripts/patch_playback.py
          python3 scripts/build_input_times.py restore
          xcodebuild build -project Streamstiny.xcodeproj -scheme Streamstiny -configuration Release -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution -skipPackageUpdates -derivedDataPath build/device -jobs "$(sysctl -n hw.logicalcpu)" -parallelizeTargets -showBuildTimingSummary ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD"
          python3 scripts/build_input_times.py save
      - name: Package and validate TrollStore IPA
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Streamstiny-TIPA
          path: build/Streamstiny.tipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Save verified XcodeGen archive
        if: github.ref == 'refs/heads/main' && steps.xcodegen.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/Streamstiny/xcodegen.zip
          key: ${{ steps.xcodegen.outputs.cache-primary-key }}
      - name: Save pinned native playback packages
        if: github.ref == 'refs/heads/main' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Save compiled release products
        if: github.ref == 'refs/heads/main' && steps.release.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/device/Build
            build/device/ModuleCache.noindex
            build/device/SDKStatCaches.noindex
            build/device/ci-inputs.json
          key: ${{ steps.release.outputs.cache-primary-key }}
  # Preserve the existing required "build" check while tests run alongside compilation.
  build:
    needs: [compile, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ needs.compile.outputs.version }}
    steps:
      - name: Require compilation and tests
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Streamstiny-TIPA
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mv build/Streamstiny.tipa build/streamstiny.ipa
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/streamstiny.ipa --clobber
          else
            gh release create "$TAG" build/streamstiny.ipa --target "$COMMIT" --title "Streamstiny $TAG" --generate-notes
          fi
