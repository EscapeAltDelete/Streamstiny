name: Build Streamstiny TIPA
on:
  push:
    branches: [main]
    paths:
      - 'Streamstiny/**'
      - 'scripts/build_input_times.py'
      - 'scripts/patch_playback.py'
      - 'scripts/package.sh'
      - 'scripts/validate_ipa.py'
      - 'scripts/Streamstiny.entitlements'
      - 'project.yml'
      - 'dependencies.yml'
      - '.github/workflows/build.yml'
      - '.gitattributes'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Streamstiny/**'
      - 'scripts/build_input_times.py'
      - 'scripts/patch_playback.py'
      - 'scripts/package.sh'
      - 'scripts/validate_ipa.py'
      - 'scripts/Streamstiny.entitlements'
      - 'project.yml'
      - 'dependencies.yml'
      - '.github/workflows/build.yml'
      - '.gitattributes'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      ${{ github.repository == 'EscapeAltDelete/Streamstiny' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
           (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/dependencies/playback-'))) }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      # Bump when changing the runner, SDK, toolchain, or cache layout.
      BUILD_CACHE_VERSION: v2-arm64-macos15-xcode16.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache validated package for these build inputs
        id: package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/Streamstiny.tipa
          key: tipa-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('Streamstiny/**', 'scripts/build_input_times.py', 'scripts/patch_playback.py', 'scripts/package.sh', 'scripts/validate_ipa.py', 'scripts/Streamstiny.entitlements', 'project.yml', 'dependencies.yml', '.github/workflows/build.yml', '.gitattributes') }}
      - name: Cache verified XcodeGen archive
        if: steps.package.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/Streamstiny/xcodegen.zip
          key: xcodegen-macos-2.44.1-a2e905fb68446e9b
      - name: Generate Xcode project
        if: steps.package.outputs.cache-hit != 'true'
        run: |
          ARCHIVE="$HOME/Library/Caches/Streamstiny/xcodegen.zip"
          mkdir -p "$(dirname "$ARCHIVE")"
          if [ ! -f "$ARCHIVE" ]; then
            curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$ARCHIVE"
          fi
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  '"$ARCHIVE" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
      - name: Cache pinned native playback packages
        id: packages
        if: steps.package.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/SourcePackages
          key: swiftpackages-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py') }}
      - name: Cache compiled release products
        if: steps.package.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/device/Build
            build/device/ModuleCache.noindex
            build/device/SDKStatCaches.noindex
            build/device/ci-inputs.json
          key: release-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py', 'scripts/build_input_times.py') }}-${{ hashFiles('project.yml', 'Streamstiny/**') }}
          restore-keys: release-${{ env.BUILD_CACHE_VERSION }}-${{ hashFiles('dependencies.yml', 'scripts/patch_playback.py', 'scripts/build_input_times.py') }}-
      - name: Build optimized ARM64 Release
        if: steps.package.outputs.cache-hit != 'true'
        run: |
          RESOLVED="Streamstiny.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ "${{ steps.packages.outputs.cache-hit }}" = "true" ] && [ -f build/SourcePackages/Package.resolved ]; then
            mkdir -p "$(dirname "$RESOLVED")"
            cp build/SourcePackages/Package.resolved "$RESOLVED"
          else
            xcodebuild -resolvePackageDependencies -project Streamstiny.xcodeproj -scheme Streamstiny -clonedSourcePackagesDirPath build/SourcePackages -skipPackageUpdates
            cp "$RESOLVED" build/SourcePackages/Package.resolved
          fi
          python3 scripts/patch_playback.py
          python3 scripts/build_input_times.py restore
          xcodebuild build -project Streamstiny.xcodeproj -scheme Streamstiny -configuration Release -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution -skipPackageUpdates -derivedDataPath build/device -jobs "$(sysctl -n hw.logicalcpu)" -parallelizeTargets -showBuildTimingSummary ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          python3 scripts/build_input_times.py save
      - name: Package and validate TrollStore IPA
        if: steps.package.outputs.cache-hit != 'true'
        run: bash scripts/package.sh
      - name: Validate cached package
        if: steps.package.outputs.cache-hit == 'true'
        run: python3 scripts/validate_ipa.py build/Streamstiny.tipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Streamstiny-TIPA
          path: build/Streamstiny.tipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
