name: Benchmark Destiny chat
on:
  workflow_dispatch:
    inputs:
      platform:
        description: UIKit benchmark platform
        type: choice
        options: [catalyst, simulator]
        default: catalyst
      review_patch:
        description: Optional gzip/base64 working-tree patch to measure before committing app changes
        type: string
        default: ''
permissions:
  contents: read
jobs:
  chat:
    if: github.repository == 'EscapeAltDelete/Streamstiny' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply explicitly requested review patch
        if: inputs.review_patch != ''
        env:
          REVIEW_PATCH: ${{ inputs.review_patch }}
        run: python3 scripts/apply_review_patch.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/Streamstiny/xcodegen.zip
          key: xcodegen-macos-2.44.1-a2e905fb68446e9b
      - name: Generate isolated chat benchmark
        run: |
          archive="$HOME/Library/Caches/Streamstiny/xcodegen.zip"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$archive"
          fi
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  '"$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          python3 scripts/prepare_chat_benchmark.py
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec build/chat-benchmark/project.yml
      - name: Prepare pinned iOS Simulator
        if: inputs.platform == 'simulator'
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS -buildVersion 18.5
          device=$(xcrun simctl create 'Chat benchmark' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Measure real chat and picker on iOS Simulator
        if: inputs.platform == 'simulator'
        run: |
          xcodebuild test -project build/chat-benchmark/ChatBenchmark.xcodeproj -scheme ChatBenchmark -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -parallel-testing-enabled NO -derivedDataPath build/chat-derived -resultBundlePath build/chat-results.xcresult > build/chat-benchmark.log 2>&1
      - name: Measure real UIKit chat on Mac Catalyst
        if: inputs.platform == 'catalyst'
        run: |
          xcodebuild test -project build/chat-benchmark/ChatBenchmark.xcodeproj -scheme ChatBenchmark -destination 'platform=macOS,variant=Mac Catalyst' -parallel-testing-enabled NO -derivedDataPath build/chat-derived -resultBundlePath build/chat-results.xcresult > build/chat-benchmark.log 2>&1
      - name: Collect screenshots and measurements
        if: always()
        run: |
          container=$(xcrun simctl get_app_container booted gg.streamstiny.chatbenchmark data 2>/dev/null || true)
          mkdir -p build/chat-artifacts
          if [ -n "$container" ]; then cp -R "$container/Documents/." build/chat-artifacts/; fi
          if [ -d "$HOME/Library/Containers/gg.streamstiny.chatbenchmark/Data/Documents" ]; then
            cp -R "$HOME/Library/Containers/gg.streamstiny.chatbenchmark/Data/Documents/." build/chat-artifacts/
          fi
          ps -eo pid,ppid,rss,%cpu,command > build/chat-artifacts/processes.txt
          cp build/chat-benchmark.log build/chat-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chat-benchmark
          path: |
            build/chat-artifacts
            build/chat-results.xcresult
          retention-days: 7
