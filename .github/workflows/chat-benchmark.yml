name: Benchmark Destiny chat
on:
  workflow_dispatch:
    inputs:
      platform:
        description: UIKit benchmark platform
        type: choice
        options: [catalyst, simulator]
        default: catalyst
      review_patch:
        description: Optional gzip/base64 working-tree patch to measure before committing app changes
        type: string
        default: ''
      simulator_version:
        description: iOS Simulator runtime for compatibility checks
        type: choice
        options: ['18.5', '17.5']
        default: '18.5'
      include_player:
        description: Also validate the real player and settings with pinned playback dependencies
        type: boolean
        default: false
      baseline_ref:
        description: Optional commit to benchmark afterward on the same runner with cold image caches
        type: string
        default: ''
      shared_assets:
        description: Use current asset loading for both refs to isolate chat rendering
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  chat:
    if: github.repository == 'EscapeAltDelete/Streamstiny' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CHAT_INCLUDE_PLAYER: ${{ inputs.include_player && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply explicitly requested review patch
        if: inputs.review_patch != ''
        env:
          REVIEW_PATCH: ${{ inputs.review_patch }}
        run: python3 scripts/apply_review_patch.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/Streamstiny/xcodegen.zip
          key: xcodegen-macos-2.44.1-a2e905fb68446e9b
      - name: Generate isolated chat benchmark
        run: |
          archive="$HOME/Library/Caches/Streamstiny/xcodegen.zip"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$archive"
          fi
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  '"$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          python3 scripts/prepare_chat_benchmark.py
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec build/chat-benchmark/project.yml
      - name: Measure production Foundation hot paths
        run: bash scripts/benchmark_runtime.sh > build/runtime-optimized.log
      - name: Prepare pinned iOS Simulator
        if: inputs.platform == 'simulator'
        env:
          SIMULATOR_VERSION: ${{ inputs.simulator_version || '18.5' }}
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS -buildVersion "$SIMULATOR_VERSION"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_VERSION//./-}"
          device=$(xcrun simctl create 'Chat benchmark' com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime")
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          if [ "$SIMULATOR_VERSION" = 18.5 ]; then
            swift_libraries=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys,pathlib,os; r=next(r for r in json.load(sys.stdin)["runtimes"] if r["version"]==os.environ["SIMULATOR_VERSION"]); print(pathlib.Path(r["bundlePath"])/"Contents/Resources/RuntimeRoot/System/Cryptexes/OS/usr/lib/swift")')
            test -f "$swift_libraries/libswiftWebKit.dylib"
            CHAT_SIMULATOR_SWIFT_LIBRARIES="$swift_libraries" python3 scripts/prepare_chat_benchmark.py
            "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec build/chat-benchmark/project.yml
          fi
      - name: Measure real chat and picker on iOS Simulator
        if: inputs.platform == 'simulator'
        run: |
          xcodebuild test -project build/chat-benchmark/ChatBenchmark.xcodeproj -scheme ChatBenchmark -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -parallel-testing-enabled NO -derivedDataPath build/chat-derived -resultBundlePath build/chat-results.xcresult > build/chat-benchmark.log 2>&1
      - name: Measure real UIKit chat on Mac Catalyst
        if: inputs.platform == 'catalyst'
        run: |
          defaults read com.apple.universalaccess reduceMotion || true
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write gg.streamstiny.chatbenchmark disableEmoteAnimations -bool false
          python3 scripts/profile_chat_processes.py build/chat-processes.jsonl &
          probe=$!
          trap 'kill "$probe" 2>/dev/null || true' EXIT
          xcodebuild test -project build/chat-benchmark/ChatBenchmark.xcodeproj -scheme ChatBenchmark -destination 'platform=macOS,variant=Mac Catalyst' -parallel-testing-enabled NO -derivedDataPath build/chat-derived -resultBundlePath build/chat-results.xcresult > build/chat-benchmark.log 2>&1
      - name: Collect screenshots and measurements
        if: always()
        run: |
          container=""
          if [ "${{ inputs.platform }}" = simulator ]; then
            container=$(xcrun simctl get_app_container booted gg.streamstiny.chatbenchmark data 2>/dev/null || true)
          fi
          mkdir -p build/chat-artifacts
          if [ -n "$container" ]; then cp -R "$container/Documents/." build/chat-artifacts/; fi
          if [ -d "$HOME/Library/Containers/gg.streamstiny.chatbenchmark/Data/Documents" ]; then
            cp -R "$HOME/Library/Containers/gg.streamstiny.chatbenchmark/Data/Documents/." build/chat-artifacts/
          fi
          ps -eo pid,ppid,rss,%cpu,command > build/chat-artifacts/processes.txt
          cp build/runtime-optimized.log build/chat-artifacts/ 2>/dev/null || true
          cp build/chat-benchmark.log build/chat-artifacts/ 2>/dev/null || true
          cp build/chat-processes.jsonl build/chat-artifacts/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path build/chat-results.xcresult --output-path build/chat-artifacts/attachments 2>/dev/null || true
      - name: Measure baseline on the same Mac Catalyst runner
        if: success() && inputs.platform == 'catalyst' && inputs.baseline_ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CHAT_ASSET_SOURCE_ROOT: ${{ inputs.shared_assets && format('{0}/Streamstiny', github.workspace) || '' }}
        run: |
          [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$BASELINE_REF"
          mkdir -p build/chat-baseline-source
          git archive "$BASELINE_REF" | tar -x -C build/chat-baseline-source
          bash scripts/benchmark_runtime.sh build/chat-baseline-source > build/chat-artifacts/runtime-baseline.log
          python3 scripts/prepare_chat_benchmark.py build/chat-baseline-source
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec build/chat-benchmark/project.yml
          python3 scripts/profile_chat_processes.py build/chat-baseline-processes.jsonl &
          probe=$!
          trap 'kill "$probe" 2>/dev/null || true' EXIT
          xcodebuild test -project build/chat-benchmark/ChatBenchmark.xcodeproj -scheme ChatBenchmark -destination 'platform=macOS,variant=Mac Catalyst' -parallel-testing-enabled NO -derivedDataPath build/chat-baseline-derived -resultBundlePath build/chat-baseline-results.xcresult > build/chat-baseline.log 2>&1
      - name: Collect paired baseline
        if: always() && inputs.baseline_ref != ''
        run: |
          cp build/chat-baseline.log build/chat-artifacts/ 2>/dev/null || true
          cp build/chat-baseline-processes.jsonl build/chat-artifacts/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path build/chat-baseline-results.xcresult --output-path build/chat-artifacts/baseline-attachments 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chat-benchmark
          path: |
            build/chat-artifacts
            build/chat-results.xcresult
            build/chat-baseline-results.xcresult
          retention-days: 7
