name: Streamstiny
include: [dependencies.yml]
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
  configs:
    Release:
      ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO
      GCC_GENERATE_DEBUGGING_SYMBOLS: NO
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ''
      COPY_PHASE_STRIP: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
targets:
  Streamstiny:
    type: application
    platform: iOS
    sources: [Streamstiny]
    dependencies:
      - package: KSPlayer
    info:
      path: Streamstiny/Info.plist
      properties:
        CFBundleDisplayName: Streamstiny
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: YES
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.streamstiny.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Streamstiny:
    build:
      targets:
        Streamstiny: all
